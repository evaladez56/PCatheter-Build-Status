        }

        function selectAllUnits() {
            const checkboxes = document.querySelectorAll('#unitCheckboxes input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = true);
        }

        function deselectAllUnits() {
            const checkboxes = document.querySelectorAll('#unitCheckboxes input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
        }

        function updateUnitAppearance(unitElement, unitId) {
            const data = unitData[unitId];
            if (!data) return;
            
            const existingIndicators = unitElement.querySelectorAll('.unit-hot-indicator, .unit-complete-indicator, .unit-wait-indicator');
            existingIndicators.forEach(ind => ind.remove());
            
            unitElement.classList.remove('complete');
            
            const groupId = unitId.split('-')[0];
            const unitNumber = unitId.split('-')[1];
            const group = unitGroups.find(g => g.id == groupId);
            
            let tooltipText = group ? `${group.name} - Unit ${unitNumber}` : `Unit ${unitNumber}`;
            if (data.notes) {
                tooltipText += `\nNotes: ${data.notes}`;
            }
            unitElement.title = tooltipText;
            
            if (group && group.color === '#d2b48c') {
                unitElement.style.color = '#000000';
            } else {
                unitElement.style.color = '';
            }
            
            if (data.waitEngineer) {
                const waitIndicator = document.createElement('span');
                waitIndicator.className = 'unit-wait-indicator';
                waitIndicator.textContent = '🛑';
                unitElement.appendChild(waitIndicator);
            }
            
            if (data.complete) {
                unitElement.classList.add('complete');
                const completeIndicator = document.createElement('span');
                completeIndicator.className = 'unit-complete-indicator';
                completeIndicator.textContent = '✓';
                unitElement.appendChild(completeIndicator);
            } else if (data.hot) {
                const hotIndicator = document.createElement('span');
                hotIndicator.className = 'unit-hot-indicator';
                hotIndicator.textContent = '🔥';
                unitElement.appendChild(hotIndicator);
            }
        }

        function saveUnitData() {
            const formData = {
                notes: document.getElementById('unitNotes').value,
                hot: document.getElementById('unitHot').checked,
                complete: document.getElementById('unitComplete').checked,
                waitEngineer: document.getElementById('unitWaitEngineer').checked,
                planForToday: document.getElementById('unitPlanForToday').value
            };
            
            if (isGroupEdit && currentEditingGroup !== null) {
                const group = unitGroups[currentEditingGroup];
                if (group) {
                    const selectedCheckboxes = document.querySelectorAll('#unitCheckboxes input[type="checkbox"]:checked');
                    const selectedUnitIds = Array.from(selectedCheckboxes).map(cb => cb.value);
                    
                    selectedUnitIds.forEach(unitId => {
                        unitData[unitId] = { ...formData };
                        const unitElement = document.getElementById(`unit-${unitId}`);
                        if (unitElement) {
                            updateUnitAppearance(unitElement, unitId);
                        }
                    });
                }
            } else if (currentEditingUnit) {
                unitData[currentEditingUnit] = formData;
                const unitElement = document.getElementById(`unit-${currentEditingUnit}`);
                if (unitElement) {
                    updateUnitAppearance(unitElement, currentEditingUnit);
                }
            }
            
            drawAllPlanArrows();
            saveState();
            closeUnitModal();
        }

        function drawAllPlanArrows() {
            const svg = document.getElementById('arrowContainer');
            const existingArrows = svg.querySelectorAll('.plan-arrow-line');
            existingArrows.forEach(arrow => arrow.remove());
            
            Object.keys(unitData).forEach(unitId => {
                const data = unitData[unitId];
                if (data && data.planForToday) {
                    drawPlanArrow(unitId, data.planForToday);
                }
            });
        }

        function drawPlanArrow(unitId, stationName) {
            const unitElement = document.getElementById(`unit-${unitId}`);
            if (!unitElement) return;
            
            const groupId = unitId.split('-')[0];
            const group = unitGroups.find(g => g.id == groupId);
            if (!group) return;
            
            const groupColor = group.color;
            
            const stations = document.querySelectorAll('.station');
            let targetStation = null;
            
            stations.forEach(station => {
                const header = station.querySelector('.station-header');
                if (header && header.textContent.trim() === stationName) {
                    targetStation = station;
                }
            });
            
            if (!targetStation) return;
            
            const unitRect = unitElement.getBoundingClientRect();
            const stationRect = targetStation.getBoundingClientRect();
            const container = document.querySelector('.container');
            const containerRect = container.getBoundingClientRect();
            
            const unitCenterX = unitRect.left + unitRect.width / 2;
            const unitCenterY = unitRect.top + unitRect.height / 2;
            const unitRadius = unitRect.width / 2;
            
            const header = targetStation.querySelector('.station-header');
            const headerRect = header.getBoundingClientRect();
            
            const headerLeft = headerRect.left;
            const headerTop = headerRect.top + headerRect.height / 2;
            
            const dx = headerLeft - unitCenterX;
            const dy = headerTop - unitCenterY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance === 0) return;
            
            const unitEdgeX = unitCenterX + (dx / distance) * unitRadius;
            const unitEdgeY = unitCenterY + (dy / distance) * unitRadius;
            
            const startX = unitEdgeX;
            const startY = unitEdgeY;
            
            const endX = headerLeft;
            const endY = headerTop;
            
            const svg = document.getElementById('arrowContainer');
            
            const markerId = `arrowhead-${groupId}`;
            let marker = document.getElementById(markerId);
            if (!marker) {
                const defs = svg.querySelector('defs');
                marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                marker.setAttribute('id', markerId);
                marker.setAttribute('markerWidth', '10');
                marker.setAttribute('markerHeight', '10');
                marker.setAttribute('refX', '9');
                marker.setAttribute('refY', '3');
                marker.setAttribute('orient', 'auto');
                
                const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                polygon.setAttribute('points', '0 0, 10 3, 0 6');
                polygon.setAttribute('fill', groupColor);
                polygon.setAttribute('fill-opacity', '0.5');
                
                marker.appendChild(polygon);
                defs.appendChild(marker);
            }
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            
            const controlX = (startX + endX) / 2;
            const controlY = Math.min(startY, endY) - 50;
            
            const d = `M ${startX} ${startY} Q ${controlX} ${controlY} ${endX} ${endY}`;
            path.setAttribute('d', d);
            path.setAttribute('class', 'plan-arrow-line');
            path.setAttribute('stroke', groupColor);
            path.setAttribute('marker-end', `url(#${markerId})`);
            
            svg.appendChild(path);
        }

        function rebuildSections() {
            const contentDiv = document.querySelector('.content');
            const existingSections = contentDiv.querySelectorAll('.section:not(.units-section)');
            existingSections.forEach(section => section.remove());
            
            const notesSection = contentDiv.querySelector('.notes-display-section');
            
            for (let i = sectionGroups.length - 1; i >= 0; i--) {
                const sectionGroup = sectionGroups[i];
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section';
                
                const heading = document.createElement('h2');
                heading.textContent = sectionGroup.name;
                
                const stationsList = document.createElement('div');
                stationsList.className = 'stations-list';
                stationsList.id = sectionGroup.listId;
                
                sectionDiv.appendChild(heading);
                sectionDiv.appendChild(stationsList);
                
                contentDiv.insertBefore(sectionDiv, notesSection.nextSibling);
            }
        }

        function renderSectionGroups() {
            const container = document.getElementById('sectionGroups');
            container.innerHTML = '';
            
            sectionGroups.forEach(sectionGroup => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'section-group';
                
                const header = document.createElement('div');
                header.className = 'section-group-header';
                
                const title = document.createElement('div');
                title.className = 'section-group-title';
                title.textContent = sectionGroup.name;
                
                const controls = document.createElement('div');
                controls.className = 'section-group-controls';
                
                const renameBtn = document.createElement('button');
                renameBtn.className = 'small-btn';
                renameBtn.textContent = 'Rename';
                renameBtn.onclick = () => renameSectionGroup(sectionGroup.id);
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'small-btn reset-button';
                removeBtn.textContent = 'Remove Section';
                removeBtn.onclick = () => removeSectionGroup(sectionGroup.id);
                
                controls.appendChild(renameBtn);
                controls.appendChild(removeBtn);
                
                header.appendChild(title);
                header.appendChild(controls);
                
                const stationsDiv = document.createElement('div');
                stationsDiv.className = 'section-stations';
                
                const stationsList = document.getElementById(sectionGroup.listId);
                if (stationsList) {
                    const stations = stationsList.querySelectorAll('.station');
                    stations.forEach(station => {
                        const stationHeader = station.querySelector('.station-header');
                        if (stationHeader) {
                            const stationName = stationHeader.textContent.trim();
                            
                            const tag = document.createElement('div');
                            tag.className = 'station-tag';
                            
                            const nameSpan = document.createElement('span');
                            nameSpan.className = 'station-tag-name';
                            nameSpan.textContent = stationName;
                            nameSpan.onclick = () => renameStation(station);
                            
                            const removeSpan = document.createElement('span');
                            removeSpan.className = 'station-tag-remove';
                            removeSpan.textContent = '×';
                            removeSpan.onclick = () => removeStationFromSection(station);
                            
                            tag.appendChild(nameSpan);
                            tag.appendChild(removeSpan);
                            stationsDiv.appendChild(tag);
                        }
                    });
                }
                
                groupDiv.appendChild(header);
                groupDiv.appendChild(stationsDiv);
                container.appendChild(groupDiv);
            });
            
            saveState();
        }

        function addSectionGroup() {
            const nameInput = document.getElementById('newSectionName');
            const name = nameInput.value.trim();
            
            if (!name) {
                alert('Please enter a section name');
                return;
            }
            
            const listId = `stationsList${sectionGroupCounter}`;
            sectionGroups.push({
                id: sectionGroupCounter++,
                name: name,
                listId: listId
            });
            
            nameInput.value = '';
            rebuildSections();
            renderSectionGroups();
            saveState();
        }

        function renameSectionGroup(sectionId) {
            const sectionGroup = sectionGroups.find(sg => sg.id === sectionId);
            if (!sectionGroup) return;
            
            const newName = prompt('Enter new section name:', sectionGroup.name);
            if (newName && newName.trim()) {
                sectionGroup.name = newName.trim();
                rebuildSections();
                
                const stationsList = document.getElementById(sectionGroup.listId);
                if (stationsList) {
                    const stations = Array.from(document.querySelectorAll('.station'));
                    stations.forEach(station => {
                        if (station.parentElement && station.parentElement.id === sectionGroup.listId) {
                            stationsList.appendChild(station);
                        }
                    });
                }
                
                renderSectionGroups();
                drawAllPlanArrows();
                saveState();
            }
        }

        function removeSectionGroup(sectionId) {
            const sectionGroup = sectionGroups.find(sg => sg.id === sectionId);
            if (!sectionGroup) return;
            
            const stationsList = document.getElementById(sectionGroup.listId);
            const stationCount = stationsList ? stationsList.querySelectorAll('.station').length : 0;
            
            if (stationCount > 0) {
                if (!confirm(`This section contains ${stationCount} station(s). All stations and their units will be removed. Continue?`)) {
                    return;
                }
            }
            
            if (stationsList) {
                const stations = stationsList.querySelectorAll('.station');
                stations.forEach(station => {
                    const units = station.querySelectorAll('.unit');
                    units.forEach(unit => {
                        const unitId = unit.dataset.unitId;
                        const groupId = unit.dataset.groupId;
                        const groupPool = document.getElementById(`group-${groupId}-pool`);
                        if (groupPool) {
                            groupPool.appendChild(unit);
                        }
                    });
                });
            }
            
            const index = sectionGroups.findIndex(sg => sg.id === sectionId);
            if (index > -1) {
                sectionGroups.splice(index, 1);
            }
            
            rebuildSections();
            renderSectionGroups();
            drawAllPlanArrows();
            saveState();
        }

        function renameStation(stationElement) {
            const header = stationElement.querySelector('.station-header');
            if (!header) return;
            
            const currentName = header.textContent.trim();
            const newName = prompt('Enter new station name:', currentName);
            
            if (newName && newName.trim() && newName.trim() !== currentName) {
                header.textContent = newName.trim();
                renderSectionGroups();
                populatePlanForTodayDropdown();
                drawAllPlanArrows();
                saveState();
            }
        }

        function removeStationFromSection(stationElement) {
            const header = stationElement.querySelector('.station-header');
            const stationName = header ? header.textContent.trim() : 'this station';
            
            const units = stationElement.querySelectorAll('.unit');
            if (units.length > 0) {
                if (!confirm(`Station "${stationName}" contains ${units.length} unit(s). Units will be returned to their groups. Continue?`)) {
                    return;
                }
                
                units.forEach(unit => {
                    const unitId = unit.dataset.unitId;
                    const groupId = unit.dataset.groupId;
                    const groupPool = document.getElementById(`group-${groupId}-pool`);
                    if (groupPool) {
                        groupPool.appendChild(unit);
                    }
                });
            }
            
            stationElement.remove();
            renderSectionGroups();
            populatePlanForTodayDropdown();
            drawAllPlanArrows();
            saveState();
        }

        function switchProduct(productId) {
            if (currentProduct === productId) return;
            
            saveState();
            
            const previousProduct = currentProduct;
            currentProduct = productId;
            
            document.querySelectorAll('.product-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            const allStates = JSON.parse(localStorage.getItem('unitAssignmentStates') || '{}');
            const savedProductState = allStates[currentProduct];
            
            document.querySelectorAll('.unit').forEach(unit => {
                unit.remove();
            });
            
            document.querySelectorAll('.unit-group').forEach(group => {
                group.remove();
            });
            
            sectionGroups.forEach(sectionGroup => {
                const stationsList = document.getElementById(sectionGroup.listId);
                if (stationsList) {
                    const stations = stationsList.querySelectorAll('.station');
                    stations.forEach(station => {
                        station.remove();
                    });
                }
            });
            
            const product = productStations[currentProduct] || productStations['peregrine-catheter'];
            
            sectionGroups[0].name = product.sectionNames.shaft;
            sectionGroups[1].name = product.sectionNames.backend;
            
            rebuildSections();
            
            if (savedProductState) {
                unitCounter = savedProductState.unitCounter || 1;
                stationCounter = savedProductState.stationCounter || 1;
                groupCounter = savedProductState.groupCounter || 1;
                sectionGroupCounter = savedProductState.sectionGroupCounter || 3;
                
                unitGroups.length = 0;
                if (savedProductState.unitGroups) {
                    unitGroups.push(...savedProductState.unitGroups);
                }
                
                Object.keys(unitData).forEach(key => delete unitData[key]);
                if (savedProductState.unitData) {
                    Object.assign(unitData, savedProductState.unitData);
                }
                
                if (savedProductState.sectionGroups) {
                    sectionGroups.length = 0;
                    sectionGroups.push(...savedProductState.sectionGroups);
                    sectionGroups[0].name = product.sectionNames.shaft;
                    sectionGroups[1].name = product.sectionNames.backend;
                    rebuildSections();
                }
            } else {
                unitCounter = 1;
                stationCounter = 1;
                groupCounter = 1;
                sectionGroupCounter = 3;
                unitGroups.length = 0;
                Object.keys(unitData).forEach(key => delete unitData[key]);
                sectionGroups.length = 0;
                sectionGroups.push(
                    { id: 1, name: product.sectionNames.shaft, listId: 'stationsList1' },
                    { id: 2, name: product.sectionNames.backend, listId: 'stationsList2' }
                );
                rebuildSections();
            }
            
            product.shaft.forEach(name => {
                createStation(name, 'stationsList1');
            });
            
            product.backend.forEach(name => {
                createStation(name, 'stationsList2');
            });
            
            mainTitle = product.title;
            const titleElement = document.querySelector('.title');
            const titleDisplay = document.getElementById('currentTitleDisplay');
            if (titleElement) titleElement.textContent = mainTitle;
            if (titleDisplay) titleDisplay.textContent = mainTitle;
            
            const notesTextarea = document.getElementById('globalNotes');
            const notesDisplay = document.getElementById('notesDisplay');
            if (savedProductState && savedProductState.notes) {
                if (notesTextarea) notesTextarea.value = savedProductState.notes;
                if (notesDisplay) notesDisplay.textContent = savedProductState.notes || 'These are the notes';
            } else {
                if (notesTextarea) notesTextarea.value = '';
                if (notesDisplay) notesDisplay.textContent = 'These are the notes';
            }
            
            populatePlanForTodayDropdown();
            
            if (savedProductState) {
                renderUnitGroups(false);
                
                setTimeout(() => {
                    unitGroups.forEach((group) => {
                        group.units.forEach(unitId => {
                            const unit = document.getElementById(`unit-${unitId}`);
                            if (unit) {
                                let placed = false;
                                
                                if (savedProductState.unitPositions && savedProductState.unitPositions[unitId]) {
                                    const stationName = savedProductState.unitPositions[unitId];
                                    const stations = document.querySelectorAll('.station');
                                    stations.forEach(station => {
                                        const header = station.querySelector('.station-header');
                                        if (header && header.textContent.trim() === stationName) {
                                            const stationContent = station.querySelector('.station-content');
                                            if (stationContent) {
                                                stationContent.appendChild(unit);
                                                placed = true;
                                            }
                                        }
                                    });
                                }
                                
                                if (!placed) {
                                    const groupPool = document.getElementById(`group-${group.id}-pool`);
                                    if (groupPool) {
                                        groupPool.appendChild(unit);
                                    }
                                }
                            }
                        });
                    });
                    updateLegend();
                    drawAllPlanArrows();
                }, 100);
            } else {
                createUnitGroup('Group 1', '#667eea');
                addUnitToGroup(0, 5);
                updateLegend();
            }
            
            renderSectionGroups();
            saveState();
        }

        function editMainTitle() {
            const newTitle = prompt('Enter new main title:', mainTitle);
            
            if (newTitle && newTitle.trim() && newTitle.trim() !== mainTitle) {
                mainTitle = newTitle.trim();
                
                const titleElement = document.querySelector('.title');
                const titleDisplay = document.getElementById('currentTitleDisplay');
                
                if (titleElement) titleElement.textContent = mainTitle;
                if (titleDisplay) titleDisplay.textContent = mainTitle;
                
                saveState();
            }
        }

        function toggleStationManagement() {
            const content = document.getElementById('stationManagementContent');
            content.classList.toggle('visible');
        }

        window.addEventListener('resize', drawAllPlanArrows);
        window.addEventListener('scroll', drawAllPlanArrows);

        const globalNotesElement = document.getElementById('globalNotes');
        if (globalNotesElement) {
            globalNotesElement.addEventListener('input', function(e) {
                const notesDisplay = document.getElementById('notesDisplay');
                if (notesDisplay) {
                    notesDisplay.textContent = e.target.value;
                }
            });
        }

        document.getElementById('unitModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeUnitModal();
            }
        });

        async function takeScreenshot() {
            const container = document.querySelector('.container');
            const availableUnitsSection = document.querySelector('.units-section');
            const controls = document.querySelector('.controls');
            const notesInputSection = document.querySelector('.notes-section');
            const productSection = document.querySelector('.product-section');
            const stationManagement = document.querySelector('.station-management');
            const screenshotButton = document.querySelector('.screenshot-button');
            const svg = document.getElementById('arrowContainer');
            
            const originalScrollY = window.scrollY;
            const originalOverflow = document.body.style.overflow;
            
            document.body.style.overflow = 'hidden';
            window.scrollTo(0, 0);
            
            await new Promise(resolve => setTimeout(resolve, 100));
            
            availableUnitsSection.style.display = 'none';
            controls.style.display = 'none';
            if (notesInputSection) notesInputSection.style.display = 'none';
            if (productSection) productSection.style.display = 'none';
            if (stationManagement) stationManagement.style.display = 'none';
            screenshotButton.style.display = 'none';
            
            await new Promise(resolve => setTimeout(resolve, 50));
            
            drawAllPlanArrows();
            
            await new Promise(resolve => setTimeout(resolve, 100));
            
            window.scrollTo(0, 0);
            
            try {
                const canvas = await html2canvas(container, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    logging: false,
                    useCORS: true
                });
                
                canvas.toBlob(async (blob) => {
                    try {
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        
                        const userChoice = confirm('Screenshot copied to clipboard!\n\nClick OK to also download the image, or Cancel to skip download.');
                        
                        if (userChoice) {
                            const url = canvas.toDataURL('image/png');
                            const link = document.createElement('a');
                            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                            link.download = `build-status-${timestamp}.png`;
                            link.href = url;
                            link.click();
                        }
                    } catch (clipboardError) {
                        const url = canvas.toDataURL('image/png');
                        const link = document.createElement('a');
                        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                        link.download = `build-status-${timestamp}.png`;
                        link.href = url;
                        link.click();
                        alert('Screenshot downloaded! (Clipboard access not available)');
                    }
                });
            } catch (error) {
                alert('Error taking screenshot: ' + error.message);
            } finally {
                availableUnitsSection.style.display = '';
                controls.style.display = '';
                if (notesInputSection) notesInputSection.style.display = '';
                if (productSection) productSection.style.display = '';
                if (stationManagement) stationManagement.style.display = '';
                screenshotButton.style.display = '';
                svg.style.display = '';
                document.body.style.overflow = originalOverflow;
                window.scrollTo(0, originalScrollY);
                drawAllPlanArrows();
            }
        }

        initializeApp();
        initializeSelectionBox();
    </script>
</body>
</html>
